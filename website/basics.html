<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="color-scheme" content="light dark"/>
  <link rel="icon" href="data:,"/>
  <title>Essential Basics (基本) — Ken Japanese Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css"/>
  <style>
    .ref-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .ref-table th, .ref-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line-soft);
      font-size: 14.5px;
    }
    .ref-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
      font-weight: 700;
    }
    .ref-table tr:hover td {
      background: var(--bg-card-subtle);
    }
    .ref-table .td-jp {
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--ink);
    }
    .ref-table .td-rom {
      font-weight: 700;
      color: var(--primary);
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">基</div>
        <div class="brand-text">
          <span>Ken Japanese</span>
          <span class="sub">JLPT N5 & Minna no Nihongo</span>
        </div>
      </a>
      <div class="header-controls">
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          🌙
        </button>
      </div>
    </div>
  </header>

  <div class="app-container">

    <!-- Scroller Navigation Bar -->
    <div class="nav-scroller">
      <nav class="main-nav">
        <a href="index.html" class="nav-item"><span class="nav-jp">あ</span> Hiragana</a>
        <a href="katakana.html" class="nav-item"><span class="nav-jp">ア</span> Katakana</a>
        <a href="basics.html" class="nav-item active"><span class="nav-jp">基</span> Basics</a>
        <a href="kotoba.html" class="nav-item"><span class="nav-jp">語</span> Kotoba (Vocab)</a>
        <a href="quiz.html" class="nav-item"><span class="nav-jp">問</span> Quiz</a>
        <a href="lessons.html" class="nav-item"><span class="nav-jp">課</span> Lessons (1-25)</a>
      </nav>
    </div>

    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-tag">Grammar & Number System</div>
      <h1 class="hero-title">Essential Basics (基本)</h1>
      <p class="hero-desc">Numbers, Counters, Telling Time, Days of the Week, Calendar Months, Dates and Common Greetings with Myanmar & English translations.</p>
    </div>

    <!-- Accordion Sections Container -->
    <div id="basicsContainer"></div>

  </div>

  <script src="assets/data/kana-data.js"></script>
  <script src="assets/data/topics-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function toggleAccordion(el) {
      el.closest('.accordion').classList.toggle('open');
    }

    function renderBasics() {
      const container = $('basicsContainer');
      let html = '';

      // 1. Numbers (かず)
      html += `
        <div class="accordion open">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="accordion-title-wrap">
              <span class="accordion-icon">数</span>
              <div>
                <div class="accordion-title">Numbers (1 – 10,000)</div>
                <div class="accordion-desc">Basic cardinal counting numbers</div>
              </div>
            </div>
            <div class="accordion-chevron">▼</div>
          </button>
          <div class="accordion-content">
            <table class="ref-table">
              <thead><tr><th>No.</th><th>Japanese</th><th>Romaji</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${NUM_TABLE.map(r => `
                  <tr>
                    <td style="font-weight:700;">${r[0]}</td>
                    <td class="td-jp">${r[1]}</td>
                    <td class="td-rom">${r[2]}</td>
                    <td>${r[4]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[1]}')" title="Listen">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      // 2. Counters (助数詞)
      html += `
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="accordion-title-wrap">
              <span class="accordion-icon">助</span>
              <div>
                <div class="accordion-title">Counters (助数詞)</div>
                <div class="accordion-desc">Age, People, Flat items, Cylinders, Animals, etc.</div>
              </div>
            </div>
            <div class="accordion-chevron">▼</div>
          </button>
          <div class="accordion-content">
            ${COUNTERS.map(c => `
              <h3 style="font-size:15px; font-weight:800; color:var(--primary); margin:16px 0 6px;">
                ${c.jp} (${c.rom}) — ${c.name} (${c.my})
              </h3>
              <table class="ref-table" style="margin-bottom:14px;">
                <thead><tr><th>No.</th><th>Japanese</th><th>Romaji</th><th>Audio</th></tr></thead>
                <tbody>
                  ${c.rows.map(r => `
                    <tr>
                      <td style="font-weight:700; width:50px;">${r[0]}</td>
                      <td class="td-jp">${r[1]}</td>
                      <td class="td-rom">${r[2]}</td>
                      <td>
                        <button class="audio-btn" onclick="speakJapanese('${r[1]}')" title="Listen">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `).join('')}
          </div>
        </div>
      `;

      // 3. Time & Clock (時間・時・分)
      html += `
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="accordion-title-wrap">
              <span class="accordion-icon">時</span>
              <div>
                <div class="accordion-title">Time & Clock (時間・時・分)</div>
                <div class="accordion-desc">Hours (~ji), Minutes (~fun/pun), and relative times</div>
              </div>
            </div>
            <div class="accordion-chevron">▼</div>
          </button>
          <div class="accordion-content">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:8px; color:var(--ink);">Hours (~時)</h4>
            <table class="ref-table" style="margin-bottom:20px;">
              <thead><tr><th>Hour</th><th>Japanese</th><th>Romaji</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${HOUR_TABLE.map(r => `
                  <tr>
                    <td style="font-weight:700;">${r[0]}</td>
                    <td class="td-jp">${r[1]}</td>
                    <td class="td-rom">${r[2]}</td>
                    <td>${r[4]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[1]}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <h4 style="font-size:14px; font-weight:800; margin-bottom:8px; color:var(--ink);">Minutes (~分)</h4>
            <table class="ref-table">
              <thead><tr><th>Min</th><th>Japanese</th><th>Romaji</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${MIN_TABLE.map(r => `
                  <tr>
                    <td style="font-weight:700;">${r[0]}</td>
                    <td class="td-jp">${r[1]}</td>
                    <td class="td-rom">${r[2]}</td>
                    <td>${r[4]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[1]}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      // 4. Days, Months & Dates (曜日・月・日)
      html += `
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="accordion-title-wrap">
              <span class="accordion-icon">暦</span>
              <div>
                <div class="accordion-title">Calendar & Dates (曜日・月・日)</div>
                <div class="accordion-desc">Days of the week, months, and days of the month (1st–31st)</div>
              </div>
            </div>
            <div class="accordion-chevron">▼</div>
          </button>
          <div class="accordion-content">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:8px; color:var(--ink);">Days of the Week (曜日)</h4>
            <table class="ref-table" style="margin-bottom:20px;">
              <thead><tr><th>Day</th><th>Japanese</th><th>Romaji</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${WEEKDAY_TABLE.map(r => `
                  <tr>
                    <td style="font-weight:700;">${r[0]}</td>
                    <td class="td-jp">${r[1]}</td>
                    <td class="td-rom">${r[2]}</td>
                    <td>${r[4]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[1]}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <h4 style="font-size:14px; font-weight:800; margin-bottom:8px; color:var(--ink);">Days of the Month (1日 – 31日)</h4>
            <table class="ref-table">
              <thead><tr><th>Date</th><th>Japanese</th><th>Romaji</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${DATE_TABLE.map(r => `
                  <tr>
                    <td style="font-weight:700;">${r[0]}</td>
                    <td class="td-jp">${r[1]}</td>
                    <td class="td-rom">${r[2]}</td>
                    <td>${r[4]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[1]}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      // 5. Common Greetings (挨拶)
      html += `
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="accordion-title-wrap">
              <span class="accordion-icon">礼</span>
              <div>
                <div class="accordion-title">Greetings & Expressions (挨拶)</div>
                <div class="accordion-desc">Daily conversational greetings and customary expressions</div>
              </div>
            </div>
            <div class="accordion-chevron">▼</div>
          </button>
          <div class="accordion-content">
            <table class="ref-table">
              <thead><tr><th>Japanese</th><th>Romaji</th><th>English</th><th>Myanmar</th><th>Audio</th></tr></thead>
              <tbody>
                ${GREETINGS.map(r => `
                  <tr>
                    <td class="td-jp">${r[0]}</td>
                    <td class="td-rom">${r[1]}</td>
                    <td style="font-weight:600;">${r[2]}</td>
                    <td>${r[3]}</td>
                    <td>
                      <button class="audio-btn" onclick="speakJapanese('${r[0]}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', renderBasics);
  </script>
</body>
</html>
